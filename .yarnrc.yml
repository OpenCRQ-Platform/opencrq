# When adding a new dependency, Yarn will use an exact version (e.g., 1.2.3)
# instead of a version range (e.g., ^1.2.3).
defaultSemverRangePrefix: ""

# This disables the collection of anonymous usage data by Yarn.
enableTelemetry: false

# This tells Yarn to install dependencies in a node_modules folder,
# which is the standard way for Node.js to resolve modules.
nodeLinker: node-modules

# security: scripts are not enabled by default and required individual activations in package.json
enableScripts: false

# security: NPM package younger than 3 days won't be considered for installation
npmMinimalAgeGate: 4320
npmPreapprovedPackages: ['@filigran/chatbot', '@filigran/design-system', '@filigran/icon', '@filigran/ui']

# @neodrag/solid declares @neodrag/core as a peer dependency that nothing provides, so Yarn
# never resolves it. @tanstack/devtools reaches @neodrag/core/sortable through its
# `development` export condition only, which breaks the Vite dev server while the production
# build takes the other condition and stays green, so no CI job catches it.
# Keep the core version in step with whatever @neodrag/solid resolves to.
packageExtensions:
  '@neodrag/solid@*':
    dependencies:
      '@neodrag/core': 3.0.0-next.11
