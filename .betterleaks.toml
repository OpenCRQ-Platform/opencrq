# Secret scan, run by .github/workflows/secret-scan.yml on the tree and by .githooks/pre-commit
# on the staged changes. Every built-in rule stays on; the allowlists below silence only the two
# generic rules, which flag any value set next to a "password" or "key" name.

[extend]
useDefault = true

[[allowlists]]
description = "Generic rules in tests, whose credentials are fake by design"
targetRules = ["generic-password", "generic-api-key"]
paths = ['''\.test\.tsx?$''']

[[allowlists]]
description = "The local stack's and the dev seed's default passwords, valid on a developer's machine only"
targetRules = ["generic-password"]
regexes = ['''^(admin|changeme|xtm_one|Admin1234!)$''']

[[allowlists]]
description = "The image boot check's admin password, generated by a shell command"
targetRules = ["generic-password"]
condition = "AND"
paths = ['''(^|/)scripts/ci/boot-image\.sh$''']
regexes = ['''\$\(''']

[[allowlists]]
description = "A password shortened with an ellipsis in the docs"
targetRules = ["generic-password"]
condition = "AND"
paths = ['''(^|/)docs/.+\.md$''']
regexes = ['''…$''']

[[allowlists]]
description = "Entity ids in the id registries (ids.ts, *-ids.ts): a UUID constant whose name ends in Key, Access or the like"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)([^/]+-)?ids\.ts$''']
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']
