receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Suffix-less names so the OTLP path exposes the same metric names as the direct
  # scrape of the platform's own /metrics endpoint (port 14269): one dashboard works
  # against either source. Counters lose their `_total` suffix on this path.
  prometheus:
    endpoint: "0.0.0.0:8889"
    translation_strategy: UnderscoreEscapingWithoutSuffixes

service:
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]

    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [otlp_http/loki]