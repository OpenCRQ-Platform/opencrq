# Filigran Flow - the gate of the Flow checkers - the guidelines' and the FEPs' -: the one check the default branch's ruleset requires,
# "Flow checkers" (FEP-0003 3.3). It runs no checker: it finds the checkers distributed here - each folder of
# .flow/checkers/ with a distributed.json -, waits for the job of each, named after its guideline, on the same
# commit, and fails when one fails, is skipped or never reports. A guideline added or removed changes only its own
# files: this file and the ruleset never change. Distributed by Filigran Flow: never edited here.
name: Flow checkers

on:
  pull_request:
    # a pull request's body or labels change a checker's result too - the method's, the specification link (FEP-0001 3.1)
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:

permissions:
  contents: read
  checks: read

# a newer event of the same pull request decides: the run it replaces stops
concurrency:
  group: flow-checkers-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: Flow checkers
    # every pull request and merge queue; on a push, the default branch only
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .flow
      - name: Wait for the job of every checker distributed here
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # an `if`, not `&&`: with no checker left, the unmatched pattern must not end the step
          checkers=$(for f in .flow/checkers/*/distributed.json; do if [ -f "$f" ]; then basename "$(dirname "$f")"; fi; done | sort)
          if [ -z "$checkers" ]; then echo "No checker is distributed here."; exit 0; fi
          deadline=$((SECONDS + 55 * 60))
          while :; do
            pending=""; failed=""
            for id in $checkers; do
              # The last run of its job on the commit decides, each run by its last attempt - a run re-run is decided
              # by its new attempt, never by the one before -, a skipped run only when no other ran: a pull request's
              # and a push's both run it, the push's skipped off the default branch; and a pull request's body edited
              # runs the method's checker again, whose new run decides (FEP-0001 3.1).
              runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$id&filter=all&per_page=100" \
                     --jq '[.check_runs | group_by(.check_suite.id)[] | max_by(.id)]
                           | (map(select(.conclusion != "skipped")) | if length > 0 then . else null end) // .
                           | if length > 0 then (max_by(.id) | .status + " " + (.conclusion // "")) else "" end')
              case ",$runs," in
                *",completed failure,"*|*",completed cancelled,"*|*",completed timed_out,"*|*",completed action_required,"*|*",completed startup_failure,"*)
                  failed="$failed $id (failure)" ;;
                *",completed success,"*|*",completed neutral,"*) ;;
                *",queued"*|*",in_progress"*|*",waiting"*|*",requested"*|*",pending"*|",,") pending="$pending $id" ;;
                *) failed="$failed $id (skipped)" ;;
              esac
            done
            if [ -n "$failed" ]; then echo "::error::A checker did not pass:$failed"; exit 1; fi
            if [ -z "$pending" ]; then echo "Every checker passed: $(echo $checkers)"; exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No result from:$pending - its workflow must run on every pull request and merge queue"; exit 1
            fi
            sleep 20
          done
