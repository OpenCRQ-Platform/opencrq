# Filigran Flow - the gate of the guidelines' checkers: the one check the default branch's ruleset requires,
# "Flow checkers" (FEP-0003 3.3). It runs no checker: it finds the checkers distributed here - each folder of
# .flow/checkers/ with a distributed.json -, waits for the job of each, named after its guideline, on the same
# commit, and fails when one fails, is skipped or never reports. A guideline added or removed changes only its own
# files: this file and the ruleset never change. Distributed by Filigran Flow: never edited here.
name: Flow checkers

on:
  pull_request:
  merge_group:
  push:

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Flow checkers
    # every pull request and merge queue; on a push, the default branch only
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .flow
      - name: Wait for the job of every checker distributed here
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # an `if`, not `&&`: with no checker left, the unmatched pattern must not end the step
          checkers=$(for f in .flow/checkers/*/distributed.json; do if [ -f "$f" ]; then basename "$(dirname "$f")"; fi; done | sort)
          if [ -z "$checkers" ]; then echo "No checker is distributed here."; exit 0; fi
          deadline=$((SECONDS + 55 * 60))
          while :; do
            pending=""; failed=""
            for id in $checkers; do
              # Every run of its job on the commit, each by its last attempt - a run re-run is decided by its new
              # attempt, never by the one before: a pull request's and a push's both run it, and the push's is
              # skipped off the default branch. One that fails fails it; one that passes passes it; a skipped run
              # counts only when no other ran.
              runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$id&filter=all&per_page=100" \
                     --jq '[.check_runs | group_by(.check_suite.id)[] | max_by(.id) | .status + " " + (.conclusion // "")] | join(",")')
              case ",$runs," in
                *",completed failure,"*|*",completed cancelled,"*|*",completed timed_out,"*|*",completed action_required,"*|*",completed startup_failure,"*)
                  failed="$failed $id (failure)" ;;
                *",completed success,"*|*",completed neutral,"*) ;;
                *",queued"*|*",in_progress"*|*",waiting"*|*",requested"*|*",pending"*|",,") pending="$pending $id" ;;
                *) failed="$failed $id (skipped)" ;;
              esac
            done
            if [ -n "$failed" ]; then echo "::error::A checker did not pass:$failed"; exit 1; fi
            if [ -z "$pending" ]; then echo "Every checker passed: $(echo $checkers)"; exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No result from:$pending - its workflow must run on every pull request and merge queue"; exit 1
            fi
            sleep 20
          done
