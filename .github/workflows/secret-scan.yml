name: Secret scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  betterleaks:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the tree
        run: scripts/secret-scan.sh "$GITHUB_WORKSPACE"

      # A secret added by one commit and removed by the next passes the tree scan, yet stays
      # readable in the pull request's commits. Merges are left out: they bring main's commits,
      # scanned there.
      - name: Scan each commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          commits="$RUNNER_TEMP/commits"
          mkdir -p "$commits"
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # Exits 1 when the commit adds or changes a file, and restore refuses an empty list.
            if ! git diff-tree --quiet --no-commit-id -r --diff-filter=ACMR "$commit"; then
              mkdir "$commits/$commit"
              git diff-tree --no-commit-id --name-only -r --diff-filter=ACMR -z "$commit" |
                git --work-tree="$commits/$commit" restore --source="$commit" --pathspec-from-file=- --pathspec-file-nul
            fi
          done
          scripts/secret-scan.sh "$commits"
