name: Check Linked Issue

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-linked-issue:
    name: Check that the PR is linked to an issue
    runs-on: ubuntu-26.04
    # A docs-drift pull request names its tracking issue in the title and must not close it.
    if: github.event.pull_request.user.login != 'docs-drift[bot]'
    steps:
      - name: Find the issue the PR closes or is part of
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Read now rather than from the event: Renovate labels a pull request after opening it.
          pr=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,closingIssuesReferences,body)

          if jq -e 'any(.labels[]; .name == "dependencies")' <<<"$pr" >/dev/null; then
            echo "Dependency update, no linked issue required."
            exit 0
          fi

          # An issue of another repository may be private, and must not stand for the link.
          linked=$(jq -r --arg repo "$REPO" '[.closingIssuesReferences[] | select("\(.repository.owner.login)/\(.repository.name)" == $repo) | "#\(.number)"] | join(", ")' <<<"$pr")

          if [ -n "$linked" ]; then
            echo "Linked issue(s): $linked"
            exit 0
          fi

          # A pull request that is one step of a larger change leaves its issue open for the last step to close.
          # HTML comments are dropped so that the template's own guidance never stands for a reference.
          parts=$(jq -r '(.body // "") | gsub("<!--[\\s\\S]*?-->"; "") | [scan("(?i)\\bpart of #([0-9]+)\\b") | .[0]] | unique | .[]' <<<"$pr")

          for number in $parts; do
            if gh api "repos/$REPO/issues/$number" 2>/dev/null \
              | jq -e --arg repo "$REPO" '.pull_request == null and .state == "open" and (.repository_url | endswith("/repos/" + $repo))' >/dev/null; then
              echo "Part of issue #$number"
              exit 0
            fi
          done

          echo "::error::The pull request closes no issue of this repository and is part of none of its open issues."
          echo "Write 'Closes #123' in its description, or 'Part of #123' when it is one step of a larger change."
          exit 1
