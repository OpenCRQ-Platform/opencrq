# The pages of the documentation site (filigran.io/docs) that describe OpenCRQ,
# read from its public mirror, FiligranHQ/xtm-docs, and audited against the code
# of the latest OpenCRQ release. Same format and same spirit as docs-map.yml:
# few, high-signal watches, the code that decides a page's claims rather than
# the code that draws them. A drift found here is reported to the mirror as an
# issue, never fixed by this repository.
#
# Every page under docs/content/opencrq/ needs an entry, and so does every page
# under docs/content/deploy/ that names OpenCRQ, unless a `# unaudited:` line
# below leaves it out, with the reason it makes no claim the code decides. The
# references under docs/content/reference/opencrq/ are generated from this
# repository's code by the site itself and are left out. Check a change with
# `node .github/docs-drift/scripts/dry-run.js --site <dir>`, <dir> holding the
# mirror's docs/content.
#
# unaudited: docs/content/deploy/index.md  the platform overview
# unaudited: docs/content/deploy/configure/xtm-one.md  XTM One's settings, OpenCRQ's address among them
# unaudited: docs/content/deploy/quick-start/with-an-ai-agent.md  what an agent's run reports
# unaudited: docs/content/deploy/upgrade/compatibility.md  the versions of the services the bundle ships

# OpenCRQ pages of the documentation site (docs/content/opencrq/), audited against the code that decides their claims.

